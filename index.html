<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>重點整理</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .main-title {
            text-align: center;
            margin-bottom: 50px;
            color: #333;
        }
        
        .subject-buttons {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }
        
        .subject-button {
            padding: 15px 30px;
            font-size: 18px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s;
            width: 250px;
            text-align: center;
        }
        
        .subject-button:hover {
            background-color: #45a049;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="main-title">重點整理</h1>
        
        <div class="subject-buttons">
            <a href="ai.html" class="subject-button">人工智能</a>
            <a href="os.html" class="subject-button">作業系統</a>
            <a href="ds.html" class="subject-button">資料結構</a>
            <!-- 未來可以添加更多學科按鈕 -->
        </div>
    </div>
</body>
</html>
